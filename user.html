<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }
        header {
            background: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #37475a;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        input, select {
            padding: 10px;
            margin: 10px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ccc;
        }
        .product img {
            width: 150px;
            height: 120px;
            object-fit: contain;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: orange;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Our Products</h1>
    <p>Welcome to online shopping</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="user.html">Products</a>
    <span id="cart">Cart: 0</span>
</nav>

<div class="container">
    <input type="text" id="search"
           placeholder="Search products..."
           oninput="showProducts()">

    <select id="category" onchange="showProducts()">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
    </select>

    <div class="products" id="products"></div>
</div>

<script>
    let cartCount = 0;

    const items = [
        {
            name: "Headphones",
            price: 999,
            category: "Electronics",
            image: "https://placehold.co/200x150?text=Headphones"
        },
        {
            name: "Smart Watch",
            price: 1499,
            category: "Electronics",
            image: "https://placehold.co/200x150?text=Smart+Watch"
        },
        {
            name: "T-Shirt",
            price: 499,
            category: "Fashion",
            image: "https://placehold.co/200x150?text=T-Shirt"
        },
        {
            name: "Shoes",
            price: 1299,
            category: "Fashion",
            image: "https://placehold.co/200x150?text=Shoes"
        }
    ];

    function showProducts() {
        let search = document.getElementById("search")
            .value.toLowerCase();

        let category = document.getElementById("category").value;

        let result = items.filter(item =>
            item.name.toLowerCase().includes(search) &&
            (category === "All" || item.category === category)
        );

        let output = document.getElementById("products");
        output.innerHTML = "";

        if (result.length === 0) {
            output.innerHTML = "<p>No products found</p>";
            return;
        }

        result.forEach((item, index) => {
            output.innerHTML += `
                <div class="product">
                    <img src="${item.image}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p>${item.category}</p>
                    <p class="price">₹${item.price}</p>
                    <button onclick="addCart()">
                        Add to Cart
                    </button>
                </div>
            `;
        });
    }

    function addCart() {
        cartCount++;
        document.getElementById("cart").innerText =
            "Cart: " + cartCount;
        alert("Product added to cart!");
    }

    showProducts();
</script>

</body>
</html>
